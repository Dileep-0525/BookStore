# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/books
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Optional - Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=ReadMoreandStayFocusOnGoalsorThingsYouInLifeDIL
#jwt.secret=mySuperSecureJwtSecretKeyForProduction123456789
jwt.expiration=95000000

# Maximum size of a single uploaded file
spring.servlet.multipart.max-file-size=10MB
file.upload.path=/uploads/pdfs/

# Maximum size of the entire multipart request
spring.servlet.multipart.max-request-size=10MB


