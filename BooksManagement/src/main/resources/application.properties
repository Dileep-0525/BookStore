spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=your-email@company.com
spring.mail.password=your-password

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Full path to the Piper Text-to-Speech executable.
# Spring Boot invokes this executable to generate speech audio from text.
tts.piper-path=C:/SoftwareSetup/piper_windows_amd64/piper/piper.exe

# Folder where all Piper voice models are stored.
# Each voice requires both a .onnx model file and its corresponding .onnx.json configuration file.
tts.model-directory=C:/SoftwareSetup/piper_windows_amd64/models

# Name of the default voice model to use.
# The service resolves the model path as:
# <tts.model.directory>/<tts.default.voice>.onnx
# Example:
# C:/SoftwareSetup/piper_windows_amd64/models/en_US-lessac-medium.onnx
tts.default-voice=en_US-lessac-medium
